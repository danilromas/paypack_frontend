services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://paypack:paypack@db:5432/paypack
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      APP_URL: http://localhost:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
    command: sh ./docker/entrypoint.dev.sh

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paypack
      POSTGRES_PASSWORD: paypack
      POSTGRES_DB: paypack
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypack -d paypack"]
      interval: 2s
      timeout: 5s
      retries: 20

  maildev:
    image: maildev/maildev
    ports:
      - "1080:1080" # web UI — http://localhost:1080
      - "1025:1025" # SMTP

volumes:
  db_data:
  node_modules:
  next_cache:
